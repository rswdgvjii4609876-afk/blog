# Optional skeleton only. H2 migrations are not portable to MySQL.
# Supply a TLS-verified JDBC URL and prepare the schema before enabling this profile.
spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: false
