<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${postCount} + ' 篇文章 · 我的博客'">我的博客</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 720px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
            line-height: 1.6;
        }
        header { border-bottom: 1px solid #eee; padding-bottom: 16px; margin-bottom: 24px; }
        h1 { margin: 0 0 8px; font-size: 28px; }
        .welcome { color: #666; margin: 0; }
        .empty {
            border: 1px dashed #ccc;
            border-radius: 8px;
            padding: 32px;
            text-align: center;
            color: #888;
        }
        .post-list { list-style: none; padding: 0; margin: 0; }
        .post-item {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 12px;
        }
        .post-item h2 { margin: 0 0 8px; font-size: 18px; }
        .post-item .summary { margin: 0 0 8px; color: #555; }
        .post-item .meta { margin: 0; font-size: 12px; color: #999; }
    </style>
</head>
<body>
    <header>
        <h1>📝 我的博客</h1>
        <p class="welcome">欢迎来到我的个人博客。记录学习、技术与生活。</p>
    </header>

    <main>
        <p><a href="/admin/posts">后台管理</a></p>

        <h2>文章列表</h2>

        <div th:if="${hasPosts}" class="post-list">
            <article th:each="post : ${posts}" class="post-item">
                <h2><a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}">标题</a></h2>
                <p class="summary" th:text="${post.summary}">摘要</p>
                <p class="meta">
                    <span>#</span><span th:text="${post.id}">0</span>
                    <span> · </span>
                    <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">时间</span>
                </p>
            </article>
        </div>

        <div th:unless="${hasPosts}" class="empty">
            <p>📭 还没有任何文章。</p>
            <p>稍后会在这里看到第一篇内容。</p>
        </div>
    </main>
</body>
</html>
