<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>我的博客 · 知行</title><script th:src="@{/js/theme.js}"></script><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="reader-home"><a class="skip-link" href="#latest-title">跳到最新文章</a>
<header class="site-header"><nav class="site-nav" aria-label="主导航"><a class="brand" th:href="@{/}">知行<span class="brand-dot">.</span></a><div class="nav-links"><a class="nav-link" th:href="@{/identity}">身份切换</a></div></nav></header>
<main id="main-content" class="site-container home-page reader-container">
    <header class="reader-welcome"><h1 th:text="${welcome}">欢迎来到我的博客，准备好了解我了吗？</h1></header>
    <section id="mood" class="mood-strip" th:if="${community != null and q.isEmpty() and postPage.first}" aria-labelledby="mood-title">
        <div class="mood-top"><h2 id="mood-title">今天心情怎么样？</h2><span th:if="${community.ownMood != null}" th:text="|你选择了${community.ownMood.label}|"></span></div>
        <form method="post" th:action="@{/community/mood}" class="mood-choices"><button th:each="entry : ${community.moods}" name="mood" th:value="${entry.mood}" type="submit" th:attr="aria-pressed=${community.ownMood == entry.mood}"><span aria-hidden="true" th:text="${entry.mood.icon}"></span><span th:text="${entry.mood.label}"></span><span class="mood-count" th:text="${entry.count}"></span></button></form>
        <p th:if="${moodNotice}" th:text="${moodNotice}" role="status"></p>
    </section>
    <section class="latest-section" aria-labelledby="latest-title">
        <header class="section-heading reader-section-heading"><h2 id="latest-title" th:text="${!q.isEmpty() ? '搜索结果' : (postPage.first ? '最新文章' : '往期文章')}">最新文章</h2>
            <details class="quiet-search" th:open="${!q.isEmpty()}"><summary>搜索文章</summary><form method="get" th:action="@{/}" role="search"><label for="post-search">标题或摘要</label><div class="search-controls"><input id="post-search" name="q" type="search" maxlength="100" th:value="${q}"><button class="button button-secondary" type="submit">搜索</button><a th:if="${!q.isEmpty()}" th:href="@{/}">清除搜索</a></div></form></details>
        </header>
        <div class="article-list" th:if="${postPage.hasContent()}">
            <section class="latest-feature" aria-label="最新发布" th:if="${q.isEmpty() and postPage.first}">
                <article th:replace="~{fragments/article-card :: card(${posts[0]}, true)}"></article>
            </section>
            <section class="archive-section" th:if="${!q.isEmpty() or !postPage.first or postPage.numberOfElements > 1}" th:attr="aria-label=${q.isEmpty() ? '往期文章' : '匹配文章'}">
                <h2 class="archive-heading" th:if="${q.isEmpty() and postPage.first}">往期文章</h2>
                <div class="archive-grid">
                    <th:block th:each="post : ${posts}" th:if="${!q.isEmpty() or !postPage.first or postStat.index > 0}">
                        <article th:replace="~{fragments/article-card :: card(${post}, false)}"></article>
                    </th:block>
                </div>
            </section>
        </div>
        <section class="empty-state" th:unless="${postPage.hasContent()}"><h3 th:text="${q.isEmpty()} ? '暂无已发布文章' : |没有找到与“${q}”匹配的文章|"></h3><p th:text="${q.isEmpty()} ? '文章发布后会显示在这里。' : '试试其他关键词，或清除搜索查看全部文章。'"></p></section>
        <nav class="pagination" th:if="${postPage.totalPages > 1}" aria-label="文章分页"><a rel="prev" th:if="${postPage.hasPrevious()}" th:href="${q.isEmpty()} ? @{/(page=${postPage.number-1})} : @{/(q=${q},page=${postPage.number-1})}">上一页</a><span class="pagination-disabled" th:unless="${postPage.hasPrevious()}" aria-disabled="true">上一页</span><span th:text="|第 ${postPage.number+1} / ${postPage.totalPages} 页|"></span><a rel="next" th:if="${postPage.hasNext()}" th:href="${q.isEmpty()} ? @{/(page=${postPage.number+1})} : @{/(q=${q},page=${postPage.number+1})}">下一页</a><span class="pagination-disabled" th:unless="${postPage.hasNext()}" aria-disabled="true">下一页</span></nav>
    </section>
    <section id="community" class="home-community" th:if="${community != null}" aria-labelledby="community-title">
        <h2 id="community-title">在这里，聊一聊</h2><p class="notice notice-success" th:if="${communityNotice}" th:text="${communityNotice}" role="status"></p><p class="notice" th:if="${communityError}" th:text="${communityError}" role="alert"></p>
        <section class="community-card poll-card" th:if="${community.poll != null}" aria-labelledby="poll-title"><h3 id="poll-title" th:text="${community.poll.question}"></h3>
            <form method="post" th:action="@{/community/polls/{id}/vote(id=${community.poll.id})}"><fieldset><legend>选一个你喜欢的答案</legend><label class="poll-option" th:each="option : ${community.poll.options}"><input type="radio" name="option" th:value="${option.index}" th:checked="${community.poll.ownChoice == option.index}" required><span th:text="${option.label}"></span><span class="poll-count" th:if="${community.poll.ownChoice != null}" th:text="|${option.votes} 票|"></span></label></fieldset><button class="button button-primary" type="submit" th:text="${community.poll.ownChoice == null ? '参与投票' : '修改选择'}"></button></form><p th:if="${community.poll.ownChoice != null}" th:text="|共 ${community.poll.votes} 份投票，感谢你的参与。|"></p>
        </section>
        <section class="community-card wall-card" aria-labelledby="wall-title"><h3 id="wall-title">给我留句话</h3><form class="comment-form" method="post" th:action="@{/community/messages}"><label for="wall-nickname">你的昵称</label><input id="wall-nickname" name="nickname" maxlength="40" required th:value="${wallNickname}" autocomplete="nickname"><label for="wall-body">想说的话</label><textarea id="wall-body" name="body" rows="3" maxlength="2000" required th:text="${wallBody}"></textarea><div class="comment-trap" aria-hidden="true"><label for="wall-website">Website</label><input id="wall-website" name="website" tabindex="-1" autocomplete="off"></div><p class="feedback-hint">审核后公开展示，请不要留下联系方式等隐私。</p><button class="button button-primary" type="submit">送出留言</button></form>
            <ol class="comment-list"><li class="reader-comment" th:each="message : ${community.messages}"><div class="comment-meta"><strong th:text="${message.nickname}"></strong><time th:text="${#temporals.format(message.createdAt,'yyyy-MM-dd','Asia/Shanghai')}"></time></div><p class="comment-body" th:text="${message.body}"></p><div class="author-reply" th:if="${message.reply != null}"><strong>作者回复</strong><p th:text="${message.reply}"></p></div></li></ol>
            <nav class="pagination" th:if="${community.messagePages > 1}" aria-label="留言分页"><a th:if="${community.messagePage > 0}" th:href="@{/(wallPage=${community.messagePage-1},page=${postPage.number},q=${q})} + '#community'">上一页</a><span th:text="|${community.messagePage+1} / ${community.messagePages}|"></span><a th:if="${community.messagePage+1 < community.messagePages}" th:href="@{/(wallPage=${community.messagePage+1},page=${postPage.number},q=${q})} + '#community'">下一页</a></nav>
        </section>
    </section>
</main><footer class="site-footer"><div class="site-container">谢谢你来读我的故事。</div></footer></body></html>
