<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${postPage.totalElements} + ' 篇文章 · Blog'">Blog</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav" aria-label="主导航">
            <a class="brand" th:href="@{/}">Blog</a>
            <div class="nav-links">
                <a class="nav-link" th:href="@{/}" aria-current="page">首页</a>
                <a class="nav-link" th:href="@{/admin/posts}">后台管理</a>
            </div>
        </nav>
    </header>

    <main class="site-container home-page">
        <section class="home-hero" aria-labelledby="home-title">
            <p class="eyebrow">个人博客</p>
            <h1 id="home-title" class="hero-title">记录学习、代码与成长。</h1>
            <p class="hero-copy">分享开发实践、学习笔记，以及一路解决的问题。</p>
        </section>

        <section class="latest-section" aria-labelledby="latest-title">
            <header class="section-heading">
                <h2 id="latest-title">最新文章</h2>
                <p class="article-count">共 <span th:text="${postPage.totalElements}">0</span> 篇</p>
            </header>

            <div th:if="${postPage.hasContent()}" class="article-list">
                <article th:each="post : ${posts}" class="article-row">
                    <div class="article-copy">
                        <h3 class="article-title">
                            <a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}">标题</a>
                        </h3>
                        <p class="article-summary" th:text="${post.summary}">摘要</p>
                        <p class="article-date" th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">时间</p>
                    </div>
                    <a class="read-link" th:href="@{/posts/{id}(id=${post.id})}">
                        阅读全文 <span aria-hidden="true">→</span>
                    </a>
                </article>
            </div>

            <nav class="pagination" th:if="${postPage.totalPages > 1}" aria-label="文章分页">
                <a th:if="${postPage.hasPrevious()}" th:href="@{/(page=${postPage.number - 1})}" rel="prev">上一页</a>
                <span class="pagination-disabled" th:unless="${postPage.hasPrevious()}" aria-disabled="true">上一页</span>
                <span class="pagination-summary" th:text="|第 ${postPage.number + 1} / ${postPage.totalPages} 页|">第 1 / 2 页</span>
                <a th:if="${postPage.hasNext()}" th:href="@{/(page=${postPage.number + 1})}" rel="next">下一页</a>
                <span class="pagination-disabled" th:unless="${postPage.hasNext()}" aria-disabled="true">下一页</span>
            </nav>

            <section th:unless="${postPage.hasContent()}" class="empty-state" aria-labelledby="empty-title">
                <h3 id="empty-title">暂无已发布文章</h3>
                <p>文章发布后会显示在这里。</p>
            </section>
        </section>
    </main>

    <footer class="site-footer">
        <div class="site-container footer-inner">Blog</div>
    </footer>
</body>
</html>
