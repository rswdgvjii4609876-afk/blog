<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>其他答案 · 作者工作台</title><script th:src="@{/js/theme.js}"></script><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="author-workspace"><header class="site-header"><nav class="site-nav" aria-label="作者导航"><a class="brand" th:href="@{/admin/overview}">知行 · 创作</a><a class="nav-link" th:href="@{/admin/overview}">返回工作台</a></nav></header><main class="site-container admin-page"><h1>“其他”答案</h1><h2 th:text="${poll.question}"></h2><p>这些文字仅登录后的作者可以查看。</p><p th:text="|共 ${total} 条|"></p><ol class="comment-list"><li class="community-card comment-body" th:each="response : ${responses}" th:text="${response.body}"></li></ol><nav class="pagination" aria-label="其他答案分页"><a th:if="${page > 0}" th:href="@{/admin/community/polls/{id}/other(id=${poll.id},page=${page-1})}">上一页</a><a th:if="${(page+1)*10 < total}" th:href="@{/admin/community/polls/{id}/other(id=${poll.id},page=${page+1})}">下一页</a></nav></main></body></html>
