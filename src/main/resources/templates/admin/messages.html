<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>留言与回复 · 知行</title><script th:src="@{/js/theme.js}"></script><link rel="stylesheet" th:href="@{/css/style.css}"><script defer th:src="@{/js/blog.js}"></script></head><body class="author-workspace"><header class="site-header"><nav class="site-nav" aria-label="作者导航"><a class="brand" th:href="@{/admin/overview}">知行 · 创作</a><div class="nav-links"><a class="nav-link" th:href="@{/admin/overview}">作者工作台</a><a class="nav-link" th:href="@{/}">查看首页</a></div></nav></header>
<main id="main-content" class="site-container admin-page"><h1>留言与作者回复</h1><p class="notice notice-success" th:if="${notice}" th:text="${notice}" role="status"></p><nav class="moderation-tabs" aria-label="留言状态"><a th:each="state : ${ {'PENDING','APPROVED','HIDDEN'} }" th:href="@{/admin/messages(status=${state})}" th:text="${state == 'PENDING' ? '待审核' : (state == 'APPROVED' ? '已公开' : '已隐藏')}" th:attr="aria-current=${state == filterStatus ? 'page' : null}"></a></nav><p th:text="|共 ${total} 条留言|"></p>
<ol class="comment-list"><li class="community-card" th:each="message : ${messages}"><div class="comment-meta"><strong th:text="${message.nickname}"></strong><time th:text="${#temporals.format(message.createdAt,'yyyy-MM-dd HH:mm','Asia/Shanghai')}"></time></div><p class="comment-body" th:text="${message.body}"></p><form class="simple-form" method="post" th:action="@{/admin/messages/{id}/reply(id=${message.id})}"><input type="hidden" name="version" th:value="${message.version}"><label th:for="|reply-${message.id}|">作者回复（仅随公开留言展示）</label><textarea th:id="|reply-${message.id}|" name="reply" maxlength="2000" rows="3" th:text="${message.reply}" required></textarea><button class="button button-secondary" type="submit">保存回复</button></form><div class="moderation-actions"><form method="post" th:if="${message.status != 'APPROVED'}" th:action="@{/admin/messages/{id}/approve(id=${message.id})}"><input type="hidden" name="version" th:value="${message.version}"><button class="button button-primary" type="submit">审核通过</button></form><form method="post" th:if="${message.status != 'HIDDEN'}" th:action="@{/admin/messages/{id}/hide(id=${message.id})}"><input type="hidden" name="version" th:value="${message.version}"><button class="button button-secondary" type="submit">隐藏留言</button></form><form method="post" data-confirm="确认永久删除这条留言和回复？" th:action="@{/admin/messages/{id}/delete(id=${message.id})}"><input type="hidden" name="version" th:value="${message.version}"><button class="button button-danger" type="submit">永久删除</button></form></div></li></ol><nav class="pagination" th:if="${pages > 1}"><a th:if="${page > 0}" th:href="@{/admin/messages(status=${filterStatus},page=${page-1})}">上一页</a><span th:text="|${page+1} / ${pages}|"></span><a th:if="${page+1 < pages}" th:href="@{/admin/messages(status=${filterStatus},page=${page+1})}">下一页</a></nav>
</main></body></html>
