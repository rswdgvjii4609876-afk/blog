<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>版本对比 · 知行</title><script th:src="@{/js/theme.js}"></script><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><header class="site-header"><nav class="site-nav" aria-label="后台导航"><a class="brand" th:href="@{/}">知行<span class="brand-dot">.</span></a><div class="nav-links"><a class="nav-link" th:href="@{/admin/overview}">工作台</a><a class="nav-link" th:href="@{/admin/posts}">文章管理</a><form class="logout-form" method="post" th:if="${adminAuthenticated}" th:action="@{/logout}"><button class="nav-link" type="submit">退出登录</button></form></div></nav></header>
<main class="site-container admin-page">
    <a class="back-link" th:href="@{/admin/posts/{id}/history/{rid}(id=${post.id},rid=${revision.id})}">← 返回历史快照</a>
    <header class="history-heading"><p class="eyebrow">VERSION DIFF / 看见每一次完善</p><h1>改了什么，一目了然。</h1><p class="page-description" th:text="|历史版本 ${revision.number} → 当前版本 ${post.version + 1}|"></p></header>
    <div class="comparison-summary"><section><span class="eyebrow">历史快照</span><h2 th:text="${revision.title}"></h2><p th:text="${revision.summary}"></p><span class="status-badge" th:text="${revision.status.name() == 'DRAFT' ? '草稿' : '已发布'}"></span></section>
    <section><span class="eyebrow">当前内容</span><h2 th:text="${post.title}"></h2><p th:text="${post.summary}"></p><span class="status-badge" th:text="${post.status.name() == 'DRAFT' ? '草稿' : '已发布'}"></span></section></div>
    <p class="notice" th:if="${comparison.tooLarge}">正文超过单侧 600 行的对比上限。为保证服务响应，请分别查看历史快照和当前编辑内容；原文未被截断或修改。</p>
    <section class="diff-panel" th:unless="${comparison.tooLarge}" aria-label="Markdown 正文逐行对比">
        <header class="diff-toolbar"><span>MARKDOWN / 源文对比</span><span><b class="diff-add-count" th:text="|+${comparison.added} 行|"></b> · <b class="diff-remove-count" th:text="|−${comparison.removed} 行|"></b></span></header>
        <p class="field-hint diff-hint" th:if="${comparison.added == 0 and comparison.removed == 0}">正文没有变化。标题、摘要和状态见上方。</p>
        <div class="diff-scroll"><table class="diff-table"><caption class="sr-only">左侧为历史行号，右侧为当前行号，减号表示删除，加号表示新增。</caption><tbody>
            <tr th:each="line : ${comparison.lines}" th:class="|diff-${line.kind}|"><td class="line-number" th:text="${line.oldNumber}"></td><td class="line-number" th:text="${line.newNumber}"></td><td class="diff-marker" th:text="${line.marker}"></td><td class="diff-code"><code th:text="${line.text}"></code></td></tr>
        </tbody></table></div>
    </section>
</main></body></html>
