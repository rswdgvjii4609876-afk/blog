<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>文章管理 · Blog</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav" aria-label="后台导航">
            <a class="brand" th:href="@{/}">Blog</a>
            <span class="nav-context">后台管理</span>
            <div class="nav-links">
                <a class="nav-link" th:href="@{/}">返回博客</a>
            </div>
        </nav>
    </header>

    <main class="site-container admin-page">
        <section class="admin-heading" aria-labelledby="admin-title">
            <div class="page-heading">
                <p class="eyebrow">后台文章管理</p>
                <h1 id="admin-title">文章管理</h1>
                <p class="page-description">管理博客中的文章内容 · 共 <span th:text="${postPage.totalElements}">0</span> 篇</p>
            </div>
            <a class="button button-primary" th:href="@{/admin/posts/new}">
                <span aria-hidden="true">+</span> 新建文章
            </a>
        </section>

        <section th:if="${postPage.hasContent()}" class="admin-list" aria-label="文章列表">
            <ul class="admin-list-items">
                <li th:each="post : ${posts}" class="admin-list-item">
                    <article class="admin-item">
                        <div class="admin-item-copy">
                            <h2 class="admin-item-title" th:text="${post.title}">标题</h2>
                            <p class="admin-item-summary" th:text="${post.summary}">摘要</p>
                            <p class="admin-item-date">
                                <span class="status-badge" th:text="${post.status == T(com.example.blog.domain.PostStatus).PUBLISHED ? '已发布' : '草稿'}">状态</span>
                                <time th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">时间</time>
                            </p>
                        </div>
                        <nav class="admin-actions" aria-label="文章操作">
                            <a class="action-link" th:if="${post.status == T(com.example.blog.domain.PostStatus).PUBLISHED}" th:href="@{/posts/{id}(id=${post.id})}">查看</a>
                            <a class="button button-secondary" th:href="@{/admin/posts/{id}/edit(id=${post.id})}">编辑</a>
                            <form method="post" th:action="@{/admin/posts/{id}/delete(id=${post.id})}">
                                <button class="button button-danger" type="submit">删除</button>
                            </form>
                        </nav>
                    </article>
                </li>
            </ul>
        </section>

        <nav class="pagination" th:if="${postPage.totalPages > 1}" aria-label="后台文章分页">
            <a th:if="${postPage.hasPrevious()}" th:href="@{/admin/posts(page=${postPage.number - 1})}" rel="prev">上一页</a>
            <span class="pagination-disabled" th:unless="${postPage.hasPrevious()}" aria-disabled="true">上一页</span>
            <span class="pagination-summary" th:text="|第 ${postPage.number + 1} / ${postPage.totalPages} 页|">第 1 / 2 页</span>
            <a th:if="${postPage.hasNext()}" th:href="@{/admin/posts(page=${postPage.number + 1})}" rel="next">下一页</a>
            <span class="pagination-disabled" th:unless="${postPage.hasNext()}" aria-disabled="true">下一页</span>
        </nav>

        <section th:unless="${postPage.hasContent()}" class="empty-state admin-empty" aria-labelledby="empty-title">
            <h2 id="empty-title">暂无文章</h2>
            <p>新建文章后，可以在这里管理草稿和已发布文章。</p>
        </section>
    </main>

    <footer class="site-footer">
        <div class="site-container footer-inner">Blog · 后台管理</div>
    </footer>
</body>
</html>
