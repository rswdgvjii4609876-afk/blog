<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" th:content="${_csrf.token}">
    <meta name="csrf-header" th:content="${_csrf.headerName}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${postId == null ? '新建文章 · 知行' : '编辑文章 · 知行'}">新建文章 · 知行</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/vendor/highlight/github-dark.min.css}">
    <script defer th:src="@{/vendor/highlight/highlight.min.js}"></script>
    <script defer th:src="@{/js/blog.js}"></script>
</head>
<body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <header class="site-header">
        <nav class="site-nav" aria-label="后台导航">
            <a class="brand" th:href="@{/}">知行<span class="brand-dot">.</span></a>
            <span class="nav-context">后台管理</span>
            <div class="nav-links">
                <a class="nav-link" th:href="@{/admin/posts}">文章列表</a>
                <a class="nav-link" th:href="@{/}">返回博客</a>
            </div>
        </nav>
    </header>

    <main id="main-content" class="site-container form-page">
        <section class="form-panel" aria-labelledby="form-title">
            <p class="notice notice-success" th:if="${param.restored != null}" role="status">历史内容已恢复为草稿。请确认内容，再决定是否发布。</p>
            <header class="form-heading">
                <h1 id="form-title" th:text="${postId == null ? '新建文章' : '编辑文章'}">新建文章</h1>
                <p class="page-description" th:text="${postId == null ? '创建文章，保存为草稿或直接发布' : '修改文章内容和状态并保存'}">创建文章，保存为草稿或直接发布</p>
            </header>

            <form class="post-form" method="post" th:object="${postForm}" th:action="${postId == null} ? @{/admin/posts} : @{/admin/posts/{id}(id=${postId})}">
                <input type="hidden" th:if="${postId != null}" th:field="*{version}">
                <div class="notice notice-error" th:if="${#fields.hasErrors('version')}" role="alert">
                    <span th:errors="*{version}">版本冲突</span>
                    <a th:if="${postId != null}" th:href="@{/admin/posts/{id}/edit(id=${postId})}" target="_blank" rel="noopener">在新窗口查看最新内容</a>
                </div>
                <div class="form-field">
                    <label for="title">标题</label>
                    <input id="title" type="text" maxlength="100" required th:field="*{title}" th:attr="aria-describedby=${#fields.hasErrors('title') ? 'title-error' : null}">
                    <span id="title-error" class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">标题错误</span>
                </div>

                <div class="form-field">
                    <label for="summary">摘要</label>
                    <textarea id="summary" rows="3" maxlength="300" required th:field="*{summary}" th:attr="aria-describedby=${#fields.hasErrors('summary') ? 'summary-error' : null}"></textarea>
                    <span id="summary-error" class="field-error" th:if="${#fields.hasErrors('summary')}" th:errors="*{summary}">摘要错误</span>
                </div>

                <div class="form-field">
                    <div class="editor-toolbar"><label for="content">正文 · Markdown</label>
                        <button type="button" class="button button-secondary" id="preview-button" th:attr="data-url=@{/admin/markdown/preview}" aria-controls="markdown-preview" aria-expanded="false">预览排版</button></div>
                    <p class="field-hint">支持标题、列表、引用、链接与代码块。原始 HTML 会作为文字显示，暂不支持图片。</p>
                    <textarea id="content" class="content-input" maxlength="100000" required rows="11" th:field="*{content}" th:attr="aria-describedby=${#fields.hasErrors('content') ? 'content-error' : null}"></textarea>
                    <div id="markdown-preview" class="markdown-body preview-panel" hidden></div>
                    <p id="preview-status" role="status" aria-live="polite"></p>
                    <span id="content-error" class="field-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">正文错误</span>
                </div>

                <div class="form-field" th:if="${postId != null or #fields.hasErrors('status')}">
                    <label for="status" th:if="${postId != null}">状态</label>
                    <select id="status" th:if="${postId != null}" th:field="*{status}" th:attr="aria-describedby=${#fields.hasErrors('status') ? 'status-error' : null}">
                        <option value="DRAFT">草稿</option>
                        <option value="PUBLISHED">已发布</option>
                    </select>
                    <span id="status-error" class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}">状态错误</span>
                </div>

                <div class="form-field">
                    <label for="changeNote">修改说明 <span class="field-hint">（选填）</span></label>
                    <input id="changeNote" th:field="*{changeNote}" maxlength="300" placeholder="这次解决了什么问题？">
                    <span class="field-error" th:if="${#fields.hasErrors('changeNote')}" th:errors="*{changeNote}"></span>
                </div>
                <div class="form-actions">
                    <a th:if="${postId != null}" class="button button-secondary" th:href="@{/admin/posts/{id}/history(id=${postId})}">修订记录</a>
                    <button class="button button-secondary" type="submit" name="status" value="DRAFT" th:if="${postId == null}">保存草稿</button>
                    <button class="button button-primary" type="submit" name="status" value="PUBLISHED" th:if="${postId == null}">发布文章</button>
                    <button class="button button-primary" type="submit" th:if="${postId != null}">保存修改</button>
                    <a class="button button-secondary" th:href="@{/admin/posts}">取消</a>
                </div>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="site-container footer-inner">知行 · 写下思考，留下成长</div>
    </footer>
</body>
</html>
