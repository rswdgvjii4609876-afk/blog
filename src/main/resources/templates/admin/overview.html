<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>作者工作台 · 知行</title><script th:src="@{/js/theme.js}"></script><link rel="stylesheet" th:href="@{/css/style.css}"><script defer th:src="@{/js/blog.js}"></script></head><body class="author-workspace">
<header class="site-header"><nav class="site-nav" aria-label="作者导航"><a class="brand" th:href="@{/admin/overview}">知行 · 创作</a><div class="nav-links"><a class="nav-link" th:href="@{/}">查看读者首页</a><a class="nav-link" th:href="@{/identity}">身份切换</a><form class="logout-form" method="post" th:if="${adminAuthenticated}" th:action="@{/logout}"><button class="nav-link" type="submit">退出登录</button></form></div></nav></header>
<main id="main-content" class="site-container admin-page"><header class="workspace-heading"><div><h1>作者工作台</h1><p>写下新故事，也听听读者的声音。</p></div><a class="button button-primary" th:href="@{/admin/posts/new}">写一篇新文章</a></header>
<p class="notice notice-success" th:if="${notice}" th:text="${notice}" role="status"></p>
<section class="dashboard-stats" aria-label="博客数据"><article><strong th:text="${dashboard.posts}"></strong><span>文章 · <span th:text="${dashboard.published}"></span> 篇已发布</span></article><a th:href="@{/admin/comments}"><strong th:text="${dashboard.pendingComments}"></strong><span>待审核评论</span></a><a th:href="@{/admin/messages}"><strong th:text="${dashboard.pendingMessages}"></strong><span>待审核留言</span></a><article><strong th:text="${dashboard.average == null ? '—' : #numbers.formatDecimal(dashboard.average,1,1)}"></strong><span th:text="|文章评分 · ${dashboard.ratings} 份|"></span></article></section>
<nav class="workspace-shortcuts" aria-label="管理入口"><a class="button button-secondary" th:href="@{/admin/posts}">管理文章</a><a class="button button-secondary" th:href="@{/admin/comments}">审核文章评论</a><a class="button button-secondary" th:href="@{/admin/messages}">留言与作者回复</a></nav>
<div class="workspace-grid"><section class="community-card"><h2>首页欢迎语</h2><form class="simple-form" method="post" th:action="@{/admin/community/welcome}"><input type="hidden" name="version" th:value="${dashboard.home.settings.version}"><label for="welcome">欢迎读者的一句话</label><textarea id="welcome" name="welcome" rows="3" maxlength="160" required th:text="${dashboard.home.settings.welcome}"></textarea><button class="button button-primary" type="submit">保存欢迎语</button></form></section>
<section class="community-card"><h2>今天的读者心情</h2><p th:text="|共 ${dashboard.home.moodTotal} 份签到，按北京时间每日统计。|"></p><ul class="mood-summary"><li th:each="entry : ${dashboard.home.moods}"><span th:text="|${entry.mood.icon} ${entry.mood.label}|"></span><strong th:text="${entry.count}"></strong></li></ul></section>
<section class="community-card"><h2>发布一个新投票</h2><p>一次展示一个投票。创建新投票前，请先结束当前投票。</p><form class="simple-form" method="post" th:action="@{/admin/community/polls}"><label for="poll-question">想问读者什么？</label><input id="poll-question" name="question" maxlength="160" required><label for="poll-options">选项（每行一个，2～6 个，每项最多 80 字）</label><textarea id="poll-options" name="options" rows="5" maxlength="1000" required></textarea><button class="button button-primary" type="submit" th:disabled="${dashboard.home.poll != null}">发布投票</button></form></section>
<section class="community-card"><h2>投票统计</h2><p th:if="${dashboard.polls.isEmpty()}">还没有发布投票。</p><article class="admin-poll" th:each="poll : ${dashboard.polls}"><h3 th:text="${poll.question}"></h3><p th:text="|${poll.open ? '进行中' : '已结束'} · ${poll.votes} 份投票|"></p><ul class="mood-summary"><li th:each="option : ${poll.options}"><span th:text="${option.label}"></span><strong th:text="|${option.votes} 票|"></strong></li></ul><form method="post" data-confirm="结束后读者将不能再参与此投票，确认结束？" th:if="${poll.open}" th:action="@{/admin/community/polls/{id}/close(id=${poll.id})}"><input type="hidden" name="version" th:value="${poll.version}"><button class="button button-secondary" type="submit">结束投票</button></form></article></section></div>
</main></body></html>
