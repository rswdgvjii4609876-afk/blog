<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>作者工作台 · 知行</title><script th:src="@{/js/theme.js}"></script><link rel="stylesheet" th:href="@{/css/style.css}"><script defer th:src="@{/js/blog.js}"></script><script defer th:src="@{/js/polls.js}"></script></head><body class="author-workspace">
<header class="site-header"><nav class="site-nav" aria-label="作者导航"><a class="brand" th:href="@{/admin/overview}">知行 · 创作</a><div class="nav-links"><a class="nav-link" th:href="@{/}">查看读者首页</a><a class="nav-link" th:href="@{/identity}">身份切换</a><form class="logout-form" method="post" th:if="${adminAuthenticated}" th:action="@{/logout}"><button class="nav-link" type="submit">退出登录</button></form></div></nav></header>
<main id="main-content" class="site-container admin-page"><header class="workspace-heading"><div><h1>作者工作台</h1><p>写下新故事，也听听读者的声音。</p></div><a class="button button-primary" th:href="@{/admin/posts/new}">写一篇新文章</a></header>
<p class="notice notice-success" th:if="${notice}" th:text="${notice}" role="status"></p>
<section class="dashboard-stats" aria-label="博客数据"><article><strong th:text="${dashboard.posts}"></strong><span>文章 · <span th:text="${dashboard.published}"></span> 篇已发布</span></article><a th:href="@{/admin/comments}"><strong th:text="${dashboard.pendingComments}"></strong><span>待审核评论</span></a><a th:href="@{/admin/messages}"><strong th:text="${dashboard.pendingMessages}"></strong><span>待审核留言</span></a><article><strong th:text="${dashboard.average == null ? '—' : #numbers.formatDecimal(dashboard.average,1,1)}"></strong><span th:text="|文章评分 · ${dashboard.ratings} 份|"></span></article></section>
<nav class="workspace-shortcuts" aria-label="管理入口"><a class="button button-secondary" th:href="@{/admin/posts}">管理文章</a><a class="button button-secondary" th:href="@{/admin/comments}">审核文章评论</a><a class="button button-secondary" th:href="@{/admin/messages}">留言与作者回复</a></nav>
<div class="workspace-grid"><section class="community-card"><h2>首页欢迎语</h2><form class="simple-form" method="post" th:action="@{/admin/community/welcome}"><input type="hidden" name="version" th:value="${dashboard.home.settings.version}"><label for="welcome">欢迎读者的一句话</label><textarea id="welcome" name="welcome" rows="3" maxlength="160" required th:text="${dashboard.home.settings.welcome}"></textarea><button class="button button-primary" type="submit">保存欢迎语</button></form></section>
<section class="community-card"><h2>今天的读者心情</h2><p th:text="|共 ${dashboard.home.moodTotal} 份签到，按北京时间每日统计。|"></p><ul class="mood-summary"><li th:each="entry : ${dashboard.home.moods}"><span th:text="|${entry.mood.icon} ${entry.mood.label}|"></span><strong th:text="${entry.count}"></strong></li></ul></section>
<section class="community-card"><h2>发布一个新投票</h2><p>一次进行一个投票。到期后可以发起新投票，也可以延长当前投票。</p>
<form class="simple-form" id="poll-editor" method="post" th:action="@{/admin/community/polls}">
    <label for="poll-question">想问读者什么？</label><input id="poll-question" name="question" maxlength="160" required>
    <fieldset class="poll-editor-options"><legend>普通选项（2～6 个，每项最多 80 字）</legend><div id="poll-options">
        <div class="poll-edit-row" th:each="number : ${#numbers.sequence(1,2)}"><label th:for="|poll-option-${number}|" th:text="|选项 ${number}|"></label><div class="poll-edit-controls"><input th:id="|poll-option-${number}|" name="options" maxlength="80" required><button class="button button-secondary remove-poll-option" type="button" hidden>删除</button></div></div>
    </div><button id="add-poll-option" class="button button-secondary" type="button" hidden>＋ 添加选项</button></fieldset>
    <label for="poll-duration">投票持续时间（从发布时开始）</label><select id="poll-duration" name="duration"><option value="24">1 天</option><option value="48">2 天</option><option value="72">3 天</option><option value="168">7 天</option><option value="custom">自定义小时数</option></select>
    <label for="poll-custom-hours">自定义时长（选自定义时填写，1～8760 整小时）</label><input id="poll-custom-hours" name="customHours" type="number" min="1" max="8760" step="1">
    <label class="poll-other-toggle"><input id="poll-other-enabled" name="otherEnabled" type="checkbox" value="true">允许读者选择“其他”并填写自己的答案</label>
    <p class="feedback-hint">“其他”的具体文字仅作者可查看，读者只能看到票数。</p>
    <button class="button button-primary" type="submit" th:disabled="${dashboard.home.poll != null and dashboard.home.poll.open}">发布投票</button>
</form></section>
<section class="community-card"><h2>投票统计</h2><p th:if="${dashboard.polls.isEmpty()}">还没有发布投票。</p>
<article class="admin-poll" th:each="poll : ${dashboard.polls}"><h3 th:text="${poll.question}"></h3><p th:text="|${poll.open ? '进行中' : '已结束'} · ${poll.votes} 份投票|"></p>
    <p th:if="${poll.endsAt != null}" th:text="|截止：${#temporals.format(poll.endsAt,'yyyy-MM-dd HH:mm','Asia/Shanghai')}（北京时间）|"></p><p th:if="${poll.endsAt == null}">旧投票，无自动截止时间，由作者手动结束。</p>
    <ol class="poll-admin-results"><li th:each="option : ${poll.options}"><span th:text="${option.label}"></span><strong th:text="|${option.votes} 票|"></strong></li></ol>
    <a class="action-link" th:if="${poll.otherEnabled}" th:href="@{/admin/community/polls/{id}/other(id=${poll.id})}">查看“其他”答案（仅作者）</a>
    <form class="simple-form poll-extension" th:if="${poll.current and poll.endsAt != null}" method="post" th:action="@{/admin/community/polls/{id}/extend(id=${poll.id})}"><input type="hidden" name="version" th:value="${poll.version}"><label th:for="|extend-${poll.id}|">延长小时数（1～8760 整小时）</label><input th:id="|extend-${poll.id}|" name="hours" type="number" min="1" max="8760" step="1" required><p class="feedback-hint">未到期从原截止时间延长；已到期从现在重新计时。</p><button class="button button-secondary" type="submit">延长截止时间</button></form>
    <form method="post" data-confirm="确认手动结束？手动结束后不能再延长此投票。" th:if="${poll.current}" th:action="@{/admin/community/polls/{id}/close(id=${poll.id})}"><input type="hidden" name="version" th:value="${poll.version}"><button class="button button-secondary" type="submit">结束投票</button></form>
</article></section></div>
</main></body></html>
