<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>稍作停留 · 知行</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><header class="site-header"><nav class="site-nav" aria-label="主导航"><a class="brand" th:href="@{/}">知行<span class="brand-dot">.</span></a></nav></header>
<main class="site-container error-page"><p class="eyebrow" th:text="|HTTP ${status}|"></p>
    <h1 th:text="${status == 404 ? '这一页还没有写下。' : (status == 409 ? '内容已经更新。' : (status == 403 ? '请刷新页面后重试。' : (status == 400 or status == 413 ? '请求需要调整一下。' : '暂时无法完成操作。')))}">暂时无法完成操作。</h1>
    <p th:text="${status == 404 ? '文章可能尚未发布，或你访问的地址已经改变。' : (status == 409 ? '为避免覆盖新内容，本次操作未完成。请返回文章管理，查看最新版本。' : (status == 403 ? '页面的安全凭据可能已过期，请重新打开表单。' : (status == 400 or status == 413 ? '请检查地址、页码或输入长度，再次尝试。' : '请稍后重试；如果问题持续，请检查应用日志。')))}"></p>
    <div class="form-actions"><a class="button button-primary" th:href="@{/}">回到首页</a><a class="button button-secondary" th:href="@{/admin/posts}">文章管理</a></div>
</main></body></html>
